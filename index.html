<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPAM Universe Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cosmic: {
                900: '#0b1020',
                800: '#0e1630',
                700: '#121c3d',
                neon: '#39FF14',
              },
            },
            boxShadow: {
              glow: '0 0 0 2px rgba(57,255,20,0.8), 0 0 20px 2px rgba(57,255,20,0.6)',
              line: '0 0 10px 2px rgba(57,255,20,0.9)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .title-font { font-family: 'Orbitron', monospace; }
      .neon-text { text-shadow: 0 0 8px rgba(57,255,20,0.9), 0 0 16px rgba(57,255,20,0.7); }
      .tile-selected { box-shadow: 0 0 0 2px rgba(57,255,20,0.8), 0 0 20px 2px rgba(57,255,20,0.6) !important; }
      .line-highlight { outline: 2px solid #39FF14; box-shadow: 0 0 10px 2px rgba(57,255,20,0.9) inset, 0 0 16px 2px rgba(57,255,20,0.6); }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-cosmic-900 via-cosmic-800 to-cosmic-700 text-white">
    <div id="root" class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script type="module">
      const { useMemo, useState, useEffect } = React;

      const STATEMENTS = [
        'Joined corporate sport challenge',
        'Used Teams background to hide the mess behind',
        'Joined a call muted and started talking',
        'Donated blood with EPAM UA Donor Community',
        'Participated in Green EPAM eco-initiatives',
        'Participated in any EPAM hackathon',
        'Randomly met a colleague outside of work',
        'Shared my experience as a speaker at an event',
        'Received over 10 badges from colleagues in a year',
        'Caught myself using IT slang in daily life',
        'Referred a friend to a hot vacancy through the referral program',
        'Bought merch from the EPAM Shop',
        'Forgot to turn off the camera and did something funny',
        'Used a discount or offer from the Benefits portal',
        'Attended more than 50 events according to Telescope stats',
        "Was asked to reinstall Windows because 'you're a programmer' :)",
        'Belong to at least 5 communities',
        'Have worked from an EPAM office or coworking space at least once',
        'Changed level or title during my time at the company',
        'Attended at least 10 trainings or courses provided by the L&D team',
        'Donated to EPAM UA internal fundraising campaigns',
        'Celebrated my 5th anniversary at EPAM',
        'Engaged in IT volunteering',
        'Left a comment on an interview or article on the Infoportal',
        'Always read news digests to stay updated',
      ];

      const PERSONAS = [
        { min: 1, max: 10, title: 'Novice Explorer', desc: 'Embarking on your first voyage—stay curious and chart your path! 🚀✨' },
        { min: 11, max: 20, title: 'Rising Star', desc: 'You are settling in and shining brighter with each mission. 🌌✨' },
        { min: 21, max: 30, title: 'Lightspeed Racer', desc: 'Swift across the cosmos—culture is part of your orbit. 🚀🌌' },
        { min: 31, max: 40, title: 'Galactic Champion', desc: 'At the heart of epic missions, inspiring the fleet. 🌠' },
        { min: 41, max: 1000, title: 'The Legend of the EPAM Universe', desc: 'A cosmic legend—present across every galaxy. 🌌🚀✨' },
      ];

      // function shuffle(array) {
      //   const result = array.slice();
      //   for (let i = result.length - 1; i > 0; i--) {
      //     const j = Math.floor(Math.random() * (i + 1));
      //     [result[i], result[j]] = [result[j], result[i]];
      //   }
      //   return result;
      // }

      function useLocalStorage(key, initialValue) {
        const [value, setValue] = useState(() => {
          try {
            const raw = localStorage.getItem(key);
            if (raw != null) return JSON.parse(raw);
          } catch {}
          return typeof initialValue === 'function' ? initialValue() : initialValue;
        });
        useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }, [key, value]);
        return [value, setValue];
      }

      function computeLines(selected) {
        const size = 5;
        const lines = [];
        // rows
        for (let r = 0; r < size; r++) {
          const indices = Array.from({ length: size }, (_, c) => r * size + c);
          if (indices.every(i => selected[i])) lines.push(indices);
        }
        // cols
        for (let c = 0; c < size; c++) {
          const indices = Array.from({ length: size }, (_, r) => r * size + c);
          if (indices.every(i => selected[i])) lines.push(indices);
        }
        // diagonals
        const d1 = [0, 6, 12, 18, 24];
        const d2 = [4, 8, 12, 16, 20];
        if (d1.every(i => selected[i])) lines.push(d1);
        if (d2.every(i => selected[i])) lines.push(d2);
        return lines;
      }

      function scoreFromSelection(selected) {
        const cells = selected.filter(Boolean).length; // 1 point each
        const lines = computeLines(selected).length;   // +5 per line
        const total = Math.min(85, cells + lines * 5);
        return { cells, lines, total };
      }

      function personaForScore(score) {
        return PERSONAS.find(p => score >= p.min && score <= p.max) || PERSONAS[0];
      }

      function App() {
        const [board, setBoard] = useLocalStorage('bingo:board', () => STATEMENTS.slice(0, 25));
        const [selected, setSelected] = useLocalStorage('bingo:selected', Array(25).fill(false));
        const [showResult, setShowResult] = useLocalStorage('bingo:showResult', false);

        // Validate stored board shape and repair if needed
        useEffect(() => {
          const valid = Array.isArray(board) && board.length === 25 && board.every(v => typeof v === 'string');
          if (!valid) {
            setBoard(shuffle(STATEMENTS).slice(0, 25));
          }
        }, [board, setBoard]);

        const completedLines = useMemo(() => computeLines(selected), [selected]);
        const score = useMemo(() => scoreFromSelection(selected), [selected]);
        const persona = useMemo(() => personaForScore(score.total), [score]);

        function toggle(index) {
          setSelected(prev => {
            const next = prev.slice();
            next[index] = !next[index];
            return next;
          });
        }

        function isInHighlightedLine(index) {
          return completedLines.some(line => line.includes(index));
        }

        function resetSelections() {
          setSelected(Array(25).fill(false));
          setShowResult(false);
        }

        // function shuffleBoard() {
        //   setBoard(shuffle(STATEMENTS).slice(0, 25));
        //   resetSelections();
        // }

        return (
          React.createElement('div', { className: 'space-y-6' },
            React.createElement('header', { className: 'text-center' },
              React.createElement('h1', { className: 'title-font neon-text text-2xl sm:text-3xl md:text-4xl font-bold' }, 'EPAM Universe Bingo: Chart Your Cosmic Path'),
              React.createElement('p', { className: 'mt-2 text-sm text-white/80' }, 'Select tiles that describe your journey. Complete lines for bonus points!')
            ),

            React.createElement('section', { className: 'grid grid-cols-5 gap-3 sm:gap-4' },
              board.map((text, idx) => {
                const isSelected = !!selected[idx];
                const inLine = isInHighlightedLine(idx);
                const base = 'relative h-24 sm:h-28 md:h-32 p-2 sm:p-3 rounded-md border border-white/15 bg-white/5 hover:bg-white/10 transition-colors';
                const selectedCls = isSelected ? ' tile-selected bg-white/10 ' : '';
                const lineCls = inLine ? ' line-highlight ' : '';
                return React.createElement('button', {
                  key: idx,
                  onClick: () => toggle(idx),
                  className: base + selectedCls + lineCls,
                },
                React.createElement('span', { className: 'text-xs sm:text-sm md:text-base text-left block' }, text));
              })
            ),

            React.createElement('section', { className: 'flex flex-wrap items-center justify-between gap-3' },
              React.createElement('div', { className: 'flex items-center gap-4' },
                React.createElement('div', { className: 'px-3 py-2 rounded bg-white/10 border border-white/10' },
                  React.createElement('span', { className: 'font-semibold' }, 'Score: '),
                  React.createElement('span', null, score.total, ' / 85')
                ),
                React.createElement('div', { className: 'text-sm text-white/80' }, `${score.cells} cells • ${score.lines} lines`)
              ),
              React.createElement('div', { className: 'flex items-center gap-2' },
                // React.createElement('button', { onClick: shuffleBoard, className: 'px-3 py-2 rounded bg-white/10 hover:bg-white/20 border border-white/20' }, 'Shuffle'),
                React.createElement('button', { onClick: resetSelections, className: 'px-3 py-2 rounded bg-white/10 hover:bg-white/20 border border-white/20' }, 'Reset'),
                React.createElement('button', { onClick: () => setShowResult(true), className: 'px-4 py-2 rounded bg-cosmic-neon text-black font-semibold hover:brightness-110' }, 'Get Result')
              )
            ),

            showResult && React.createElement('section', { className: 'mt-2 rounded-lg border border-white/10 bg-black/30 p-4' },
              React.createElement('div', { className: 'flex items-start justify-between gap-4' },
                React.createElement('div', null,
                  React.createElement('h2', { className: 'title-font text-xl neon-text font-bold' }, persona.title),
                  React.createElement('p', { className: 'mt-1 text-white/85' }, persona.desc)
                ),
                React.createElement('button', { onClick: () => setShowResult(false), className: 'px-3 py-2 rounded bg-white/10 hover:bg-white/20 border border-white/20' }, 'Close')
              )
            ),

            React.createElement('details', { className: 'mt-2 bg-white/5 border border-white/10 rounded p-4' },
              React.createElement('summary', { className: 'cursor-pointer font-semibold' }, 'How to Play'),
              React.createElement('ul', { className: 'mt-2 list-disc pl-5 text-sm space-y-1 text-white/90' }, [
                'Click tiles that are true for you. Click again to unselect.',
                'Complete any row, column, or diagonal to earn +5 bonus points.',
                'Press Get Result to see your cosmic persona.',
                'Use Shuffle to get a fresh board. Progress is saved locally.',
              ].map((t, i) => React.createElement('li', { key: i }, t)))
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
